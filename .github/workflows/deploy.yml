name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Verify new post publication and draft exclusion
        run: npm run test:publishing
      - name: Verify SEO metadata and tracking script exclusion
        run: npm run test:seo
      - name: Verify language feeds and subscriber compatibility
        run: npm run test:rss
      - name: Verify legacy WordPress links
        run: npm run test:legacy
      - name: Verify maintained site asset integrity
        run: npm run test:media
      - name: Verify site asset deployment and retired source absence
        run: npm run test:assets
      - name: Verify routes and assets
        run: python3 scripts/verify-build.py
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          # Project Pages mounts this artifact at /insights/.
          path: dist/insights

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify project Pages target
        run: |
          if [ "$GITHUB_REPOSITORY" != "CINEV/insights" ]; then
            echo "::error::Rename the repository to CINEV/insights before deploying the project Pages artifact."
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
